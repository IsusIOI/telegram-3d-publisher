<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a10"><title>Публикация 3D-модели</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#222544,#080a10 60%);color:#f5f7ff;font:15px/1.5 system-ui,sans-serif;min-height:100vh;padding:24px}.wrap{max-width:680px;margin:5vh auto;background:#11141ee8;border:1px solid #ffffff18;border-radius:24px;padding:28px;box-shadow:0 20px 80px #0005}h1{margin:0 0 8px;font-size:28px}.sub{color:#aab2c5;margin:0 0 24px}label{display:block;font-size:13px;color:#c8cee0;margin:16px 0 7px}input,textarea{width:100%;border:1px solid #ffffff22;background:#090c14;color:white;border-radius:12px;padding:13px;font:inherit}textarea{min-height:90px;resize:vertical}input[type=file]{padding:10px}button{border:0;border-radius:12px;padding:14px 18px;background:linear-gradient(135deg,#a99cff,#5dcdf5);font-weight:800;color:#090b12;cursor:pointer;width:100%;margin-top:20px}button:disabled{opacity:.55;cursor:wait}.note{font-size:12px;color:#9da6ba;margin-top:14px}.result{display:none;white-space:pre-wrap;padding:14px;border-radius:12px;margin-top:16px;background:#171c29}.result.error{color:#ffc2ce}.result.ok{color:#a4ffe0}a{color:#a99cff}
</style></head><body><main class="wrap"><h1>3D Krutilka — публикация</h1><p class="sub">Загрузи работу — бот опубликует её в канале @isusgame с кнопкой «Покрутить в 3D».</p><form id="form"><label>Ключ администратора</label><input id="key" type="password" autocomplete="current-password" required placeholder="Ключ, который задашь в Netlify"><label>Название работы</label><input id="title" maxlength="120" required placeholder="Например: Зажигалка — Cinema 4D"><label>Описание (необязательно)</label><textarea id="description" maxlength="700" placeholder="Коротко о модели..."></textarea><label>Модель .glb</label><input id="model" type="file" accept=".glb,model/gltf-binary" required><label>Превью для поста (необязательно, JPG/PNG)</label><input id="preview" type="file" accept="image/jpeg,image/png"><button id="submit" type="submit">Опубликовать в Telegram</button></form><div id="result" class="result"></div><p class="note">Не отправляй ключ администратора и токен бота другим людям. Текущая простая версия поддерживает модели небольшого размера; позже можно подключить загрузку больших файлов.</p></main><script>
const $=id=>document.getElementById(id);const result=$('result');const toBase64=file=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});
$('form').addEventListener('submit',async e=>{e.preventDefault();const model=$('model').files[0],preview=$('preview').files[0],button=$('submit');if(!model)return;button.disabled=true;button.textContent='Загрузка и публикация…';result.style.display='none';result.className='result';try{const payload={adminKey:$('key').value,title:$('title').value,description:$('description').value,fileName:model.name,modelBase64:await toBase64(model)};if(preview){payload.previewBase64=await toBase64(preview);payload.previewType=preview.type}const response=await fetch('/.netlify/functions/publish',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const data=await response.json();result.style.display='block';if(!response.ok||!data.ok){result.classList.add('error');result.textContent='Не получилось: '+(data.error||'неизвестная ошибка')+(data.modelUrl?'\nМодель сохранена: '+data.modelUrl:'')}else{result.classList.add('ok');result.textContent='Готово! Пост опубликован.\n'+data.viewUrl;$('form').reset()}}catch(err){result.style.display='block';result.classList.add('error');result.textContent='Ошибка сети: '+err.message}finally{button.disabled=false;button.textContent='Опубликовать в Telegram'}});
</script></body></html>
